[workspace]
members = ["crates/attested-request"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.1.0"
license = "MIT"
homepage = "https://github.com/worldcoin/attested-proxy"
repository = "https://github.com/worldcoin/attested-proxy"

[workspace.dependencies]
base64 = "0.22"
ciborium = "0.2"
getrandom = { version = "0.3", features = ["std"] }
http = "1"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sfv = "0.15"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
module_name_repetitions = "allow"
