# Builds and publishes the attested-proxy sidecar image to GHCR (attested).
name: Build and Push Docker Image

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - "Dockerfile"
      - ".github/workflows/build-docker.yml"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (including v prefix, e.g. v0.1.0)"
        required: false
        type: string
      push:
        description: "Push the image to GHCR."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "Commit to build. Defaults to the calling workflow's ref."
        required: false
        type: string
      version:
        description: "Version tag to publish (including v prefix)."
        required: false
        type: string
      push:
        description: "Push to GHCR. False builds only."
        required: false
        default: true
        type: boolean
    outputs:
      digest:
        description: "Digest of the built image."
        value: ${{ jobs.docker-build.outputs.digest }}
      image:
        description: "Fully-qualified name of the image, so callers need no second copy of the mapping."
        value: ${{ jobs.docker-build.outputs.image }}

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/${{ github.repository_owner }}/attested-proxy
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve version
        id: version
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          # `latest` only for stable semver (no -alpha / -rc suffix).
          if [[ "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/attested-proxy
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || steps.version.outputs.is_stable == 'true' }}
            type=sha
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' || inputs.push == true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          # Publish on push/tag/dispatch; PRs and dry runs build only (validation).
          push: ${{ github.event_name == 'push' || inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.push == true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository_owner }}/attested-proxy
          subject-digest: ${{ steps.build.outputs.digest }}