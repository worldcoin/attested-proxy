[package]
name = "attested-proxy"
description = "A sidecar that verifies World App attested-key canonical requests and proxies them to a sibling service."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
attested-request.workspace = true
attested-request-tower.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "server-auto", "server-graceful", "tokio"] }
metrics.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true

[dev-dependencies]
attested-request = { workspace = true, features = ["test-util"] }
axum = { workspace = true, features = ["http1", "json", "tokio", "ws"] }
futures-util.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
