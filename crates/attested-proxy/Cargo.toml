[package]
name = "attested-proxy"
description = "A sidecar that verifies World App attested-key canonical requests and proxies them to a sibling service."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
license-file.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
default = ["redis"]
# A Redis-backed replay guard, shared by every replica.
redis = ["dep:redis"]

[dependencies]
anyhow.workspace = true
attested-request = { workspace = true, features = ["remote-jwks"] }
attested-request-tower.workspace = true
bytes.workspace = true
cadence.workspace = true
clap.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "server-auto", "server-graceful", "tokio"] }
metrics.workspace = true
metrics-exporter-statsd.workspace = true
rand.workspace = true
redis = { workspace = true, optional = true, features = ["connection-manager", "tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
reqwest.workspace = true
telemetry-batteries.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true

[dev-dependencies]
attested-request = { workspace = true, features = ["test-util"] }
axum = { workspace = true, features = ["http1", "json", "tokio", "ws"] }
futures-util.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
