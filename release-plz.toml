[workspace]
git_release_enable = true
git_release_type = "auto"
pr_labels = ["release"]
release = false
publish = false
changelog_update = true

# attested-request owns the version tag and the changelog; attested-request-tower is released
# alongside it. attested-proxy is a container, not a crate, and is not published.
[[package]]
name = "attested-request"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
changelog_include = ["attested-request-tower"]
release = true
publish = true

[[package]]
name = "attested-request-tower"
git_tag_enable = false
git_release_enable = false
changelog_update = false
release = true
publish = true